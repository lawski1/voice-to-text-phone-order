<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Shop Order Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .stat-card h3 {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        
        .stat-card .value {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }
        
        .filters {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .filters select, .filters button {
            padding: 10px 15px;
            margin-right: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        
        .filters button {
            background: #667eea;
            color: white;
            border: none;
            cursor: pointer;
        }
        
        .filters button:hover {
            background: #5568d3;
        }
        
        .orders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }
        
        .order-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        
        .order-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .order-id {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
        
        .order-status {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        .status-pending { background: #fff3cd; color: #856404; }
        .status-confirmed { background: #d1ecf1; color: #0c5460; }
        .status-preparing { background: #d4edda; color: #155724; }
        .status-ready { background: #cce5ff; color: #004085; }
        .status-completed { background: #d1f2eb; color: #00695c; }
        .status-cancelled { background: #f8d7da; color: #721c24; }
        
        .order-info {
            margin-bottom: 15px;
        }
        
        .order-info p {
            margin: 5px 0;
            color: #666;
            font-size: 14px;
        }
        
        .order-info strong {
            color: #333;
        }
        
        .order-items {
            margin: 15px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 5px;
        }
        
        .order-items h4 {
            margin-bottom: 10px;
            color: #333;
        }
        
        .order-items ul {
            list-style: none;
        }
        
        .order-items li {
            padding: 5px 0;
            color: #666;
        }
        
        .order-total {
            font-size: 20px;
            font-weight: bold;
            color: #667eea;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid #f0f0f0;
        }
        
        .order-actions {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        
        .order-actions button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s;
        }
        
        .btn-confirm { background: #28a745; color: white; }
        .btn-confirm:hover { background: #218838; }
        
        .btn-preparing { background: #17a2b8; color: white; }
        .btn-preparing:hover { background: #138496; }
        
        .btn-ready { background: #007bff; color: white; }
        .btn-ready:hover { background: #0056b3; }
        
        .btn-complete { background: #6c757d; color: white; }
        .btn-complete:hover { background: #5a6268; }
        
        .btn-cancel { background: #dc3545; color: white; }
        .btn-cancel:hover { background: #c82333; }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 18px;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
        }
        
        .phone-number {
            font-family: monospace;
            color: #667eea;
        }
        
        @media (max-width: 768px) {
            .orders-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>☕ Coffee Shop Order Dashboard</h1>
            <p>Real-time voice-to-text phone orders</p>
        </header>
        
        <div class="stats" id="stats">
            <div class="stat-card">
                <h3>Total Orders</h3>
                <div class="value" id="totalOrders">-</div>
            </div>
            <div class="stat-card">
                <h3>Today's Orders</h3>
                <div class="value" id="todayOrders">-</div>
            </div>
            <div class="stat-card">
                <h3>Pending</h3>
                <div class="value" id="pendingOrders">-</div>
            </div>
            <div class="stat-card">
                <h3>Total Revenue</h3>
                <div class="value" id="totalRevenue">$0</div>
            </div>
        </div>
        
        <div class="filters">
            <select id="statusFilter">
                <option value="">All Statuses</option>
                <option value="pending">Pending</option>
                <option value="confirmed">Confirmed</option>
                <option value="preparing">Preparing</option>
                <option value="ready">Ready</option>
                <option value="completed">Completed</option>
                <option value="cancelled">Cancelled</option>
            </select>
            <button onclick="loadOrders()">Refresh</button>
            <button onclick="loadStats()">Update Stats</button>
        </div>
        
        <div id="error" class="error" style="display: none;"></div>
        
        <div id="loading" class="loading">Loading orders...</div>
        
        <div class="orders-grid" id="ordersGrid"></div>
    </div>
    
    <script>
        const API_BASE = window.location.origin + '/api';
        
        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/orders/stats/summary`);
                const stats = await response.json();
                
                document.getElementById('totalOrders').textContent = stats.totalOrders || 0;
                document.getElementById('todayOrders').textContent = stats.todayOrders || 0;
                document.getElementById('pendingOrders').textContent = stats.ordersByStatus?.pending || 0;
                document.getElementById('totalRevenue').textContent = '$' + (stats.totalRevenue || 0).toFixed(2);
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }
        
        async function loadOrders() {
            const statusFilter = document.getElementById('statusFilter').value;
            const loadingEl = document.getElementById('loading');
            const errorEl = document.getElementById('error');
            const ordersGrid = document.getElementById('ordersGrid');
            
            loadingEl.style.display = 'block';
            errorEl.style.display = 'none';
            ordersGrid.innerHTML = '';
            
            try {
                const url = `${API_BASE}/orders${statusFilter ? '?status=' + statusFilter : ''}`;
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error('Failed to load orders');
                }
                
                const orders = await response.json();
                
                if (orders.length === 0) {
                    ordersGrid.innerHTML = '<div class="loading">No orders found</div>';
                } else {
                    orders.forEach(order => {
                        ordersGrid.appendChild(createOrderCard(order));
                    });
                }
                
                loadingEl.style.display = 'none';
            } catch (error) {
                loadingEl.style.display = 'none';
                errorEl.textContent = 'Error loading orders: ' + error.message;
                errorEl.style.display = 'block';
            }
        }
        
        function createOrderCard(order) {
            const card = document.createElement('div');
            card.className = 'order-card';
            
            const statusClass = `status-${order.status}`;
            const formattedDate = new Date(order.created_at).toLocaleString();
            
            card.innerHTML = `
                <div class="order-header">
                    <div class="order-id">Order #${order.id}</div>
                    <div class="order-status ${statusClass}">${order.status}</div>
                </div>
                <div class="order-info">
                    <p><strong>Phone:</strong> <span class="phone-number">${order.phone_number || 'N/A'}</span></p>
                    <p><strong>Customer:</strong> ${order.customer_name || 'Not provided'}</p>
                    <p><strong>Time:</strong> ${formattedDate}</p>
                </div>
                <div class="order-items">
                    <h4>Order Details:</h4>
                    <p style="margin-top: 10px; color: #333;">${order.order_text}</p>
                    ${order.items && order.items.length > 0 ? `
                        <ul>
                            ${order.items.map(item => `<li>${item}</li>`).join('')}
                        </ul>
                    ` : ''}
                </div>
                <div class="order-total">Total: $${(order.total_amount || 0).toFixed(2)}</div>
                <div class="order-actions">
                    ${getActionButtons(order.status, order.id)}
                </div>
            `;
            
            return card;
        }
        
        function getActionButtons(currentStatus, orderId) {
            const buttons = [];
            
            if (currentStatus === 'pending') {
                buttons.push(`<button class="btn-confirm" onclick="updateStatus(${orderId}, 'confirmed')">Confirm</button>`);
                buttons.push(`<button class="btn-cancel" onclick="updateStatus(${orderId}, 'cancelled')">Cancel</button>`);
            } else if (currentStatus === 'confirmed') {
                buttons.push(`<button class="btn-preparing" onclick="updateStatus(${orderId}, 'preparing')">Start Preparing</button>`);
            } else if (currentStatus === 'preparing') {
                buttons.push(`<button class="btn-ready" onclick="updateStatus(${orderId}, 'ready')">Mark Ready</button>`);
            } else if (currentStatus === 'ready') {
                buttons.push(`<button class="btn-complete" onclick="updateStatus(${orderId}, 'completed')">Complete</button>`);
            }
            
            return buttons.join('');
        }
        
        async function updateStatus(orderId, newStatus) {
            try {
                const response = await fetch(`${API_BASE}/orders/${orderId}/status`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ status: newStatus })
                });
                
                if (!response.ok) {
                    throw new Error('Failed to update status');
                }
                
                // Reload orders and stats
                loadOrders();
                loadStats();
            } catch (error) {
                alert('Error updating order status: ' + error.message);
            }
        }
        
        // Initial load
        loadStats();
        loadOrders();
        
        // Auto-refresh every 10 seconds
        setInterval(() => {
            loadOrders();
            loadStats();
        }, 10000);
    </script>
</body>
</html>
